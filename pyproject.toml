[project]
name = "skill-matrix"
version = "0.1.0"
description = "Распределённая система управления компетенциями"
readme = "README.md"
authors = [
    { name = "TimeJerker", email = "krov1chh@gmail.com" },
    { name = "KsysaY", email = "jashina.xen@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.53",
    "uvicorn>=0.54.0",
]

[project.scripts]
skill-matrix = "skill_matrix:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
