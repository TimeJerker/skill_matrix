syntax = "proto3";

package matching;

message FindCandidatesRequest {
    int32 skill_id = 1;
    int32 project_id = 2;
    int32 min_level = 3;
}

message Candidate {
    int32 user_id = 1;
    string username = 2;
    string email = 3;
    int32 level = 4;
    int32 role_id = 5;    
    string department = 6;
}

message FindCandidatesResponse {
    repeated Candidate candidates = 1;
}

service MatchingService {
    rpc FindCandidates(FindCandidatesRequest) returns (FindCandidatesResponse);
}

service MatchingServiceStream {
    rpc FindCandidatesStream(FindCandidatesRequest) returns (stream Candidate);
}