services:
  db:
    image: postgres:16
    container_name: skill_matrix_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: skill_matrix_nginx
    restart: always
    ports: 
      - "80:80"
    volumes: 
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api 
      - api2

  rabbitmq:
    image: rabbitmq:3-management
    container_name: skill_matrix_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  grpc:
    build:
      context: .
      target: grpc
      dockerfile: Dockerfile_grpc
    container_name: skill_matrix_grpc
    command: uv run --no-sync python -u -m src.skill_matrix.grpc.grpc_service
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DATABASE_PASS: ${DATABASE_PASS}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
      dockerfile: Dockerfile_api
    container_name: skill_matrix_api
    command: uv run uvicorn src.skill_matrix.rest_api.api:app --host 0.0.0.0 --port 8000
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DATABASE_PASS: ${DATABASE_PASS}
      DB_NAME: ${DB_NAME}
      RABBITMQ_HOST: rabbitmq
      GRPC_HOST: grpc
      INSTANCE_ID: "API_1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      grpc:
        condition: service_started

  api2:
    build:
      context: .
      target: api
      dockerfile: Dockerfile_api
    container_name: skill_matrix_api2
    command: uv run uvicorn src.skill_matrix.rest_api.api:app --host 0.0.0.0 --port 8000
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DATABASE_PASS: ${DATABASE_PASS}
      DB_NAME: ${DB_NAME}
      RABBITMQ_HOST: rabbitmq
      GRPC_HOST: grpc
      INSTANCE_ID: "API_2"
    ports:
      - "8088:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      grpc:
        condition: service_started

  notification:
    build:
      context: .
      target: notification
      dockerfile: Dockerfile_noth
    container_name: skill_matrix_notification
    restart: unless-stopped
    command: uv run python -m src.skill_matrix.communication.notification_service
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DATABASE_PASS: ${DATABASE_PASS}
      DB_NAME: ${DB_NAME}
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8001:8001"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data: